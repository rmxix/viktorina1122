<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тест</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#18181b;height:100vh;overflow:hidden;display:flex;justify-content:center;align-items:center}
.collage{position:fixed;inset:0;pointer-events:none;z-index:1}
.collage img{position:absolute;width:250px;height:350px;object-fit:cover;border:4px solid #fff;opacity:.72}
.p1{top:-20px;left:-20px;transform:rotate(-6deg)}.p2{top:-25px;left:38%;transform:rotate(4deg)}.p3{top:-15px;right:-20px;transform:rotate(7deg)}
.p4{bottom:-25px;left:-15px;transform:rotate(5deg)}.p5{bottom:-30px;left:40%;transform:rotate(-4deg)}.p6{bottom:-20px;right:-20px;transform:rotate(-7deg)}
.ov{position:fixed;inset:0;background:rgba(18,18,22,.6);z-index:2;pointer-events:none}
#pin{display:flex;flex-direction:column;align-items:center;gap:15px;z-index:100;background:#fff;padding:30px;border:3px solid #111;box-shadow:8px 8px 0 #111}
input{padding:12px;font-size:18px;border:2px solid #111;text-align:center;font-weight:bold}
.scr{display:none;width:92%;max-width:580px;flex-direction:column;align-items:center;gap:22px;z-index:10}
.scr.act{display:flex}
.txt{font-size:22px;font-weight:800;text-align:center;background:#fff;padding:18px 25px;border:3px solid #111;box-shadow:6px 6px 0 #111;width:100%;max-width:440px}
.simg{width:220px;height:220px;object-fit:cover;border:4px solid #fff;box-shadow:8px 8px 0 #111}
.row{display:flex;justify-content:space-between;width:100%;max-width:480px;gap:14px}
.row.c{justify-content:center}
button{background:#18181b;color:#fff;border:2px solid #fff;box-shadow:4px 4px 0 #111;padding:14px 18px;font-size:15px;font-weight:600;cursor:pointer;min-width:160px}
.g{background:#e4e4e7;color:#111;border-color:#111}.b{background:#3b5998;border-color:#111}
.bk{font-size:13px;padding:8px 14px;min-width:auto;background:#fff;color:#111;border-color:#111}
@media(max-width:600px){.collage img{width:150px;height:210px}button{min-width:125px;padding:11px 8px;font-size:14px}}
</style>
</head>
<body>
<div class="collage">
<img src="1.jpg.jpg" class="p1"><img src="2.jpg.jpg" class="p2"><img src="3.jpg.jpg" class="p3">
<img src="4.jpg.jpg" class="p4"><img src="5.jpg.jpg" class="p5"><img src="6.jpg.jpg" class="p6">
</div>
<div class="ov"></div>

<div id="pin">
<h2>Введите секретный код</h2>
<input type="password" id="in" placeholder="********">
<button type="button" onclick="go()">Войти</button>
<p id="err" style="color:red;font-weight:bold;display:none">Неверный код!</p>
</div>

<div id="s1" class="scr">
<div class="row"><button onclick="opt('Алёна','s2')">1. Алёна</button><button class="g" onclick="opt('Оно','s3')">2. Оно</button></div>
<div class="txt">Кем ты себя позиционируешь?</div>
<div class="row"><button class="b" onclick="opt('Вова..','s4')">3. Вова..</button><button onclick="opt('Нету такого ответа','s5')">4. Нету такого ответа</button></div>
</div>

<div id="s2" class="scr">
<div class="row"><button onclick="fin('Алёна -> Сто процентов')">1. Сто процентов</button><button class="g" onclick="fin('Алёна -> Затрудняюсь ответить')">2. Затрудняюсь ответить</button></div>
<div class="txt">Уверенна?</div>
<div class="row c"><button class="b" onclick="fin('Алёна -> Иди домой')">3. Иди домой</button></div>
<button class="bk" onclick="sw('s1')">← В начало</button>
</div>

<div id="s3" class="scr">
<div class="txt">Так то ты себя позиционируешь она/её</div>
<div class="row"><button onclick="fin('Оно -> Извини меня пожалуйста')">1. Извини меня пожалуйста</button><button class="g" onclick="fin('Оно -> Прошу прощения')">2. Прошу прощения</button></div>
<button class="bk" onclick="sw('s1')">← В начало</button>
</div>

<div id="s4" class="scr">
<div class="row"><button onclick="fin('Вова -> Он в прошлом')">1. Он в прошлом</button><button class="b" onclick="fin('Вова -> Вову')">2. Вову</button></div>
<div class="txt">А кого бы ты из класса …</div>
<div class="row c"><button class="g" onclick="fin('Вова -> Подумаю, поразмышляю')">3. Подумаю, поразмышляю</button></div>
<button class="bk" onclick="sw('s1')">← В начало</button>
</div>

<div id="s5" class="scr">
<img src="7.jpg.jpg" class="simg">
<div class="txt">Плохо Алёна, пробуй снова</div>
<div class="row c"><button class="b" onclick="sw('s1')">Попробовать снова</button></div>
</div>

<script>
var U="https://google.com";
function log(t){new Image().src=U+"?text="+encodeURIComponent(t)}
function sw(id){document.querySelectorAll('.scr').forEach(function(e){e.classList.remove('act')});document.getElementById(id).classList.add('act')}
function go(){if(document.getElementById('in').value==="11092012"){document.getElementById('pin').style.display='none';sw('s1');log("Вход")}else{document.getElementById('err').style.display='block'}}
document.getElementById('in').onkeypress=function(e){if(e.key==='Enter')go()};
function opt(b,id){log("Вопрос 1: "+b);sw(id)}
function fin(t){log("Финал: "+t);alert("Ответ принят!")}
</script>
</body>
</html>
