<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Секретный тест</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: radial-gradient(circle at 25% 20%, #ffffff 0%, #e5e7eb 45%, #cbd5e1 100%);
            color: #111111;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        body::before {
            content: "";
            position: absolute;
            width: 88%;
            height: 88%;
            max-width: 720px;
            max-height: 540px;
            border: 3px solid #18181b;
            background: rgba(255, 255, 255, 0.55);
            box-shadow: 10px 10px 0px #18181b;
            pointer-events: none;
            z-index: 1;
        }
        #pin-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            z-index: 100;
            background: #ffffff;
            padding: 35px 40px;
            border: 3px solid #111111;
            box-shadow: 8px 8px 0px #111111;
        }
        #pin-screen h2 { text-transform: uppercase; letter-spacing: 1px; font-size: 20px; color: #111111; }
        #pin-input {
            padding: 12px 20px;
            font-size: 18px;
            border: 2px solid #111111;
            background: #f4f4f5;
            color: #111111;
            text-align: center;
            outline: none;
            font-weight: bold;
        }
        #pin-input:focus { background: #ffffff; border-color: #3b5998; }
        .screen {
            display: none;
            width: 90%;
            max-width: 620px;
            min-height: 360px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 28px;
            z-index: 10;
            padding: 20px;
        }
        .screen.active { display: flex; }
        .center-text {
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            background: #ffffff;
            color: #111111;
            padding: 20px 30px;
            border: 3px solid #111111;
            box-shadow: 6px 6px 0px #111111;
            line-height: 1.35;
            width: 100%;
            max-width: 460px;
        }
        .btn-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 500px;
            gap: 16px;
        }
        .btn-row.center-only { justify-content: center; }
        button {
            background-color: #18181b;
            color: #ffffff;
            border: 2px solid #111111;
            box-shadow: 4px 4px 0px #52525b;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            min-width: 170px;
            text-align: center;
        }
        .btn-gray { background-color: #d4d4d8; color: #111111; box-shadow: 4px 4px 0px #18181b; }
        .btn-blue { background-color: #4b6cb7; color: #ffffff; box-shadow: 4px 4px 0px #18181b; }
        button:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px #111111; filter: brightness(1.08); }
        button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px #111111; }
        .back-btn {
            margin-top: 5px;
            font-size: 13px;
            padding: 8px 16px;
            min-width: auto;
            background: #ffffff;
            color: #3f3f46;
            border: 2px solid #3f3f46;
            box-shadow: 3px 3px 0px #3f3f46;
        }
        .back-btn:hover { background: #18181b; color: #ffffff; }
        @media (max-width: 550px) {
            body::before { width: 94%; height: 90%; }
            .center-text { font-size: 20px; padding: 16px 20px; }
            .btn-row { gap: 10px; }
            button { min-width: 130px; padding: 12px 10px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <div id="pin-screen">
        <h2>Введите секретный код</h2>
        <input type="password" id="pin-input" placeholder="********">
        <button onclick="checkPin()">Войти</button>
        <p id="pin-error" style="color: #dc2626; font-weight: bold; display: none;">Неверный код!</p>
    </div>

    <div id="screen-main" class="screen">
        <div class="btn-row">
            <button onclick="chooseOption('Алёна', 'screen-alena')">1. Алёна</button>
            <button class="btn-gray" onclick="chooseOption('Оно', 'screen-ono')">2. Оно</button>
        </div>
        <div class="center-text">Кем ты себя позиционируешь?</div>
        <div class="btn-row">
            <button class="btn-blue" onclick="chooseOption('Вова..', 'screen-vova')">3. Вова..</button>
            <button onclick="chooseOption('Нету такого ответа', 'screen-no-answer')">4. Нету такого ответа</button>
        </div>
    </div>

    <div id="screen-alena" class="screen">
        <div class="btn-row">
            <button onclick="finalClick('Ветка Алёна -> Сто процентов')">1. Сто процентов</button>
            <button class="btn-gray" onclick="finalClick('Ветка Алёна -> Затрудняюсь ответить')">2. Затрудняюсь ответить</button>
        </div>
        <div class="center-text">Уверенна?</div>
        <div class="btn-row center-only">
            <button class="btn-blue" onclick="finalClick('Ветка Алёна -> Иди домой')">3. Иди домой</button>
        </div>
        <button class="back-btn" onclick="goBack()">← В начало</button>
    </div>

    <div id="screen-ono" class="screen">
        <div class="center-text">Так то ты себя позиционируешь она/её</div>
        <div class="btn-row">
            <button onclick="finalClick('Ветка Оно -> Извини меня пожалуйста')">1. Извини меня пожалуйста</button>
            <button class="btn-gray" onclick="finalClick('Ветка Оно -> Прошу прощения')">2. Прошу прощения</button>
        </div>
        <button class="back-btn" onclick="goBack()">← В начало</button>
    </div>

    <div id="screen-vova" class="screen">
        <div class="btn-row">
            <button onclick="finalClick('Ветка Вова -> Он в прошлом')">1. Он в прошлом</button>
            <button class="btn-blue" onclick="finalClick('Ветка Вова -> Вову')">2. Вову</button>
        </div>
        <div class="center-text">А кого бы ты из класса …</div>
        <div class="btn-row center-only">
            <button class="btn-gray" onclick="finalClick('Ветка Вова -> Подумаю, поразмышляю')">3. Подумаю, поразмышляю</button>
        </div>
        <button class="back-btn" onclick="goBack()">← В начало</button>
    </div>

    <div id="screen-no-answer" class="screen">
        <div class="center-text">Плохо Алёна, пробуй снова</div>
        <div class="btn-row center-only">
            <button class="btn-blue" onclick="goBack()">Попробовать снова</button>
        </div>
    </div>

    <script>
        const SECRET_PIN = "11092012";
        const TG_BOT_TOKEN = "9154005315:AAGAd-uNHs4foLlm03Y-xf11Ik1TYwSU2OU";
        const TG_CHAT_ID = "7732801430";

        function checkPin() {
            const input = document.getElementById('pin-input').value;
            if (input === SECRET_PIN) {
                document.getElementById('pin-screen').style.display = 'none';
                showScreen('screen-main');
                sendTelegram("🔓 Введен правильный ПИН-КОД!");
            } else {
                document.getElementById('pin-error').style.display = 'block';
                sendTelegram("⚠️ Неверный пин-код: " + input);
            }
        }

        document.getElementById('pin-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkPin();
        });

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function chooseOption(buttonName, nextScreenId) {
            sendTelegram("🔘 Первый вопрос: «" + buttonName + "»");
            showScreen(nextScreenId);
        }

        function finalClick(actionText) {
            sendTelegram("✅ Выбор сделан: " + actionText);
            alert("Ответ принят!");
        }

        function goBack() {
            sendTelegram("🔄 Возврат в начало");
            showScreen('screen-main');
        }

        function sendTelegram(messageText) {
            const url = `https://telegram.org{TG_BOT_TOKEN}/sendMessage`;
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: TG_CHAT_ID, text: messageText })
            }).catch(err => console.error(err));
        }
    </script>
</body>
</html>
